name: Cleanup obsolete branches (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-obsolete-branches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete integrated obsolete branch refs
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'agent/m2-v4-14-dynamo-port'
            'agent/m2-v4-16-corona-return-port'
            'agent/m2-v4-18-two-port-return'
            'agent/m2-v4-19-rear-plate-human-return'
            'agent/m2-v4-20-local-infrastructure-bound'
            'agent/m2-v4-21-real-power-field-bound'
            'agent/m2-v4-22-source-reaction-boundary'
            'agent/m2-v4-23-non-electrical-source-bounds'
            'agent/m2-v4-24-earth-rotation-coupling-bound'
            'agent/m2-v4-25-natural-geoelectric-bound'
            'agent/research-branch-integration-audit-2026-08-19'
            'agent/cleanup-obsolete-branches'
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

      - name: Remove this one-shot workflow and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/cleanup-obsolete-branches.yml
          python scripts/generate_manifest.py
          python scripts/check_manifest.py
          git add -A .github/workflows/cleanup-obsolete-branches.yml MANIFEST.json MANIFEST_SHA256.txt
          if git diff --cached --quiet; then
            echo 'Cleanup workflow already removed and manifest current.'
          else
            git commit -m 'chore: remove one-shot branch cleanup workflow'
            git push origin HEAD:main
          fi
