name: Materialize V4 best-evidence M2 build package

on:
  push:
    branches:
      - main
      - agent/v4-best-evidence-m2
    paths:
      - 'cad/generate_v4_best_evidence_m2.py'
      - 'scripts/build_v4_package.py'
      - 'scripts/rebuild_research_assets.py'
      - 'docs/REPLICATION_STATUS.md'
      - 'docs/research/v4-*.md'
      - 'docs/research/replica-configuration-matrix.md'
      - 'docs/research/experiment-plan.md'
      - 'docs/research/safety.md'
      - '.github/workflows/materialize-v4-best-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-writers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize to latest branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git checkout "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

      - name: Install CAD dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cad.txt

      - name: Generate V4 STEP/STL assemblies
        run: python cad/generate_v4_best_evidence_m2.py

      - name: Verify required V4 outputs
        shell: bash
        run: |
          set -euo pipefail
          root='hardware/experimental/v4-best-evidence-m2'
          test -s "$root/stl/rotor_24wire_floating_R0_v4.stl"
          test -s "$root/step/rotor_24wire_floating_R0_v4.step"
          test -s "$root/stl/pot_terminal_lid_2wire_v4.stl"
          test -s "$root/step/pot_terminal_lid_2wire_v4.step"
          test -s "$root/stl/hub_arc_pair_v4_video_refined.stl"
          test -s "$root/stl/outer_panel_layered_v4.stl"
          test -s "$root/stl/lower_central_cage_v4.stl"
          test -s "$root/complete-model/Testatika_M2_V4_BEST_EVIDENCE.stl"
          test -s "$root/complete-model/Testatika_M2_V4_BEST_EVIDENCE.step"
          test -s "$root/complete-model/Testatika_M2_V4_R4_RESEARCH.stl"
          test -s "$root/complete-model/Testatika_M2_V4_R4_RESEARCH.step"
          test -s "$root/metadata/MODEL_INFO_V4.json"

      - name: Build deterministic V4 package
        run: python scripts/build_v4_package.py

      - name: Verify package checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release/experimental
          sha256sum -c testatika-m2-v4-best-evidence-build-package.zip.sha256

      - name: Refresh repository integrity metadata
        run: |
          python scripts/generate_manifest.py
          python scripts/check_manifest.py

      - name: Commit materialized V4 assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            hardware/experimental/v4-best-evidence-m2 \
            release/experimental/testatika-m2-v4-best-evidence-build-package.zip \
            release/experimental/testatika-m2-v4-best-evidence-build-package.zip.sha256 \
            MANIFEST.json MANIFEST_SHA256.txt
          if git diff --cached --quiet; then
            echo 'V4 assets already materialized and current.'
          else
            git commit -m 'build: materialize V4 best-evidence M2 package'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
