name: Integrate M2 V4.13 load-duration storage audit

on:
  push:
    branches:
      - agent/m2-v4-fully-floating
    paths:
      - 'sim/m2_v4_13_load_duration_storage_bound.py'
      - 'tests/test_m2_v4_13_load_duration_storage_bound.py'
      - 'docs/research/load-duration-storage-audit-2026-08-18.md'
      - 'docs/research/internet-source-ledger-round13.tsv'
      - 'scripts/apply_m2_v4_13_load_duration_storage.py'
      - '.github/workflows/apply-m2-v4-13-load-duration-storage.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-writers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize to latest branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git checkout "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply idempotent V4.13 integration
        run: python scripts/apply_m2_v4_13_load_duration_storage.py
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run V4.13 regression tests
        run: python -m pytest tests/test_m2_v4_13_load_duration_storage_bound.py -q
      - name: Validate repository structure and evidence guardrails
        run: python scripts/validate_assets.py
      - name: Refresh and verify integrity manifest
        run: |
          python scripts/generate_manifest.py
          python scripts/check_manifest.py
      - name: Commit integrated V4.13 state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/research/source-basis.md \
            docs/REPLICATION_STATUS.md \
            docs/M6_REPLICATION_STATUS.md \
            docs/research/experiment-plan.md \
            docs/research/evidence_matrix.tsv \
            STATE.md addon.md CHANGELOG.md \
            MANIFEST.json MANIFEST_SHA256.txt
          if git diff --cached --quiet; then
            echo 'V4.13 already integrated and current.'
          else
            git commit -m 'research: integrate V4.13 load-duration bounds'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
