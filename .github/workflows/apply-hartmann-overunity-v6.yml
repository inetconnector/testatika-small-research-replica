name: Verify Hartmann Overunity V6 migration (historical/manual)

# V6 is already integrated. This workflow is retained to verify that the historical
# migration script is idempotent; it no longer writes to main automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-additive-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected repository state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run historical V6 migration idempotency check
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_hartmann_overunity_v6.py
          if ! git diff --quiet; then
            echo 'ERROR: historical V6 migration is no longer idempotent against the current repository:'
            git diff --stat
            exit 1
          fi

      - name: Validate repository
        run: python scripts/validate_assets.py

      - name: Historical migration note
        run: echo 'V6 is integrated; this workflow performs no commit or push.'
