name: Refresh repository manifest

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths-ignore:
      - 'MANIFEST.json'
      - 'MANIFEST_SHA256.txt'
      - '.github/V4_MATERIALIZE_TRIGGER'
      - '.github/BUILDKIT_MATERIALIZE_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-writers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize to latest branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - name: Regenerate manifest and SHA-256 ledger
        run: python scripts/generate_manifest.py
      - name: Verify generated manifest
        run: python scripts/check_manifest.py
      - name: Commit refreshed integrity metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.json MANIFEST_SHA256.txt
          if git diff --cached --quiet; then
            echo 'Manifest already current.'
          else
            git commit -m 'chore: refresh repository manifest'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
