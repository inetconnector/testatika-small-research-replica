name: Consolidation preservation audit (historical/manual)

# Historical consolidation logic is retained as documentation, but automatic branch
# deletion and main writes are permanently disabled. Git history/snapshot tags preserve
# the consolidation record.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-consolidated-state:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current repository state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate current repository and canonical V2/V3 assets
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_assets.py
          test -s hardware/complete-model/Testatika_Small_Marinov_FirstMachine_V2_COMPLETE.step
          test -s hardware/complete-model/Testatika_Small_Marinov_FirstMachine_V2_COMPLETE.stl
          test -s hardware/complete-model/Testatika_Small_Marinov_FirstMachine_V3_COMPLETE.step
          test -s hardware/complete-model/Testatika_Small_Marinov_FirstMachine_V3_COMPLETE.stl

      - name: Verify canonical V3 aliases remain byte-identical to experimental originals
        shell: bash
        run: |
          set -euo pipefail
          cmp \
            hardware/experimental/v3-photo/complete-model/Testatika_Small_Marinov_FirstMachine_V3_PHOTO_INTERP.step \
            hardware/complete-model/Testatika_Small_Marinov_FirstMachine_V3_COMPLETE.step
          cmp \
            hardware/experimental/v3-photo/complete-model/Testatika_Small_Marinov_FirstMachine_V3_PHOTO_INTERP.stl \
            hardware/complete-model/Testatika_Small_Marinov_FirstMachine_V3_COMPLETE.stl
          cmp \
            hardware/experimental/v3-photo/complete-model/MODEL_INFO_V3.json \
            hardware/complete-model/MODEL_INFO_V3.json

      - name: Historical consolidation note
        run: |
          echo 'This workflow no longer deletes branches or commits to main.'
          echo 'The original destructive consolidation implementation remains recoverable in Git history.'
          echo 'See docs/repository-consolidation-2026-08-16.md and PRESERVATION.md.'
