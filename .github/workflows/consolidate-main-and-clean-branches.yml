name: One-shot obsolete branch cleanup 2026-08-19

# One-shot maintenance workflow requested by the repository owner.
# It archives every branch tip to an immutable-style tag before deleting the branch ref.
# Active research branches are intentionally excluded.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/consolidate-main-and-clean-branches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive and delete only verified obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

          # branch|expected-tip. The expected tip prevents deleting a branch that moved
          # after this cleanup was reviewed.
          specs=(
            'agent/add-earth-cloud-docx|5fb4d0af79ddf8430e74d5b3397d4649f3e42e11'
            'agent/self-excitation-phase-commutation|81fc8f62d4af2a991c31e5a712cef0df91c1d77c'
            'research/m2-v3-distributed-rotor|49e66ddb53091a8b484ac3cbe36da9c4ae728dd1'
            'research/regenerative-grid-model|f5503b9cb148b85def274a26ef10226f2092ca41'
          )

          for spec in "${specs[@]}"; do
            branch="${spec%%|*}"
            expected="${spec##*|}"
            ref="refs/remotes/origin/${branch}"
            if ! git show-ref --verify --quiet "$ref"; then
              echo "Branch already absent: $branch"
              continue
            fi
            actual="$(git rev-parse "$ref")"
            if [[ "$actual" != "$expected" ]]; then
              echo "REFUSING cleanup: $branch moved: expected $expected, got $actual" >&2
              exit 1
            fi

            safe="${branch//\//-}"
            short="${actual:0:12}"
            tag="archive-branch-${safe}-20260819-${short}"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              tagged="$(git rev-parse "refs/tags/$tag")"
              [[ "$tagged" == "$actual" ]] || { echo "Tag collision for $tag" >&2; exit 1; }
            else
              git tag "$tag" "$actual"
            fi
          done

          # Push recovery anchors first. No branch is deleted unless all tags are durable.
          git push origin --tags

          for spec in "${specs[@]}"; do
            branch="${spec%%|*}"
            if git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
              git push origin --delete "$branch"
            fi
          done

      - name: Cleanup summary
        run: |
          echo 'Deleted only the four explicitly verified obsolete branch refs.'
          echo 'Their exact tips remain preserved as archive-branch-* tags.'
          echo 'Kept main, agent/m2-v4-fully-floating, and agent/wiring-lamella-audit-2026-08-17.'
