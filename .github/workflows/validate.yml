name: Validate repository

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate German/English README parity
        run: python scripts/check_readme_sync.py
      - name: Require paired README changes in pull requests
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check_readme_sync.py --require-pair
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
      - name: Require paired README changes on pushes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: >-
          python scripts/check_readme_sync.py --require-pair
          "${{ github.event.before }}"
          "${{ github.sha }}"
      - name: Validate repository structure and CAD assets
        run: python scripts/validate_assets.py
      - name: Validate evidence wiring registries and diagrams
        run: python scripts/check_evidence_wiring.py
      - name: Run source-bound, phase-resonance and reservoir-isolation regression tests
        run: >-
          python -m pytest -q
          tests/test_m2_v4_14_dynamo_port.py
          tests/test_m2_v4_15_resonant_effective_aperture.py
          tests/test_m2_v4_16_corona_return_port.py
          tests/test_m2_v4_17_corotation_dynamo_bound.py
          tests/test_m2_v4_18_two_port_return.py
          tests/test_m2_v4_19_rear_plate_human_return.py
          tests/test_m2_v4_20_local_infrastructure_bound.py
          tests/test_m2_v4_21_real_power_field_bound.py
          tests/test_m2_v4_22_source_reaction_boundary.py
          tests/test_m2_v4_23_non_electrical_source_bounds.py
          tests/test_m2_v4_24_earth_rotation_coupling_bound.py
          tests/test_m2_v4_25_natural_geoelectric_bound.py
          tests/test_m2_v4_26_two_time_phase_resonance.py
          tests/test_m2_v4_27_reservoir_isolation.py
          tests/test_m2_v4_28_source_elimination_matrix.py
          tests/test_m2_v4_29_surface_redox_reservoir.py
          tests/test_m2_v4_30_burst_buffered_redox.py
          tests/test_m2_v4_31_pot_envelope_reservoir_bound.py
      - name: Verify committed integrity manifest
        if: github.event_name != 'push'
        run: python scripts/check_manifest.py
