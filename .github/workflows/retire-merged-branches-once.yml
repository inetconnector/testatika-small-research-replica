name: One-shot retire merged branches 2026-08-19

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/retire-merged-branches-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact tips and delete merged/stale branch refs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

          specs=(
            'agent/m2-v4-fully-floating|cf986427d9eced2577d414ba3eb207f96db37b85'
            'agent/wiring-lamella-audit-2026-08-17|656c7989d70f195ff3d49c31f0945ba33721e810'
          )

          for spec in "${specs[@]}"; do
            branch="${spec%%|*}"
            expected="${spec##*|}"
            ref="refs/remotes/origin/${branch}"
            if ! git show-ref --verify --quiet "$ref"; then
              echo "Already absent: $branch"
              continue
            fi
            actual="$(git rev-parse "$ref")"
            if [[ "$actual" != "$expected" ]]; then
              echo "REFUSING: $branch moved: expected $expected, got $actual" >&2
              exit 1
            fi
            safe="${branch//\//-}"
            tag="archive-branch-${safe}-20260819-${actual:0:12}"
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              git tag "$tag" "$actual"
            fi
          done

          git push origin --tags

          for spec in "${specs[@]}"; do
            branch="${spec%%|*}"
            if git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
              git push origin --delete "$branch"
            fi
          done

      - name: Self-remove and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/retire-merged-branches-once.yml
          python scripts/generate_manifest.py
          python scripts/check_manifest.py
          git add MANIFEST.json MANIFEST_SHA256.txt
          git commit -m 'ops: finish merged branch retirement'
          git push origin main
