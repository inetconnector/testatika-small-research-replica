name: Apply repository hardening corrections

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'scripts/apply_repository_hardening.py'
      - '.github/workflows/apply-repository-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply additive STATE/addon corrections
        run: python scripts/apply_repository_hardening.py
      - name: Validate no tracked file was deleted
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-status | awk '$1=="D" {print $2}')"
          test -z "$deleted" || { echo "Unexpected deletions:"; echo "$deleted"; exit 1; }
      - name: Commit additive corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATE.md addon.md
          if git diff --cached --quiet; then
            echo 'Hardening corrections already applied.'
          else
            git commit -m 'docs: append repository hardening corrections [skip ci]'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
