name: Materialize M6 Large V1 best-evidence build package

on:
  push:
    branches:
      - main
      - agent/m6-large-v1-best-evidence
    paths:
      - 'cad/generate_m6_large_v1.py'
      - 'scripts/check_m6_assets.py'
      - 'scripts/normalize_m6_step.py'
      - 'scripts/build_m6_package.py'
      - 'scripts/apply_m6_state.py'
      - 'scripts/apply_m6_readme_links.py'
      - 'scripts/rebuild_research_assets.py'
      - 'docs/M6_REPLICATION_STATUS.md'
      - 'docs/research/m6-large-v1-*'
      - 'hardware/experimental/m6-large-v1-best-evidence/README.md'
      - '.github/workflows/materialize-m6-large-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-writers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize to latest branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git checkout "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
      - name: Apply additive M6 state and top README links
        run: |
          python scripts/apply_m6_state.py
          python scripts/apply_m6_readme_links.py
      - name: Install CAD dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cad.txt
      - name: Generate detailed M6 STEP/STL family
        run: python cad/generate_m6_large_v1.py
      - name: Normalize volatile STEP metadata
        run: python scripts/normalize_m6_step.py
      - name: Verify M6 geometry, metadata and complete assemblies
        run: python scripts/check_m6_assets.py
      - name: Build deterministic M6 package
        run: python scripts/build_m6_package.py
      - name: Verify M6 package checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release/experimental
          sha256sum -c testatika-m6-large-v1-best-evidence-build-package.zip.sha256
      - name: Refresh repository integrity metadata
        run: |
          python scripts/generate_manifest.py
          python scripts/check_manifest.py
      - name: Commit materialized M6 assets and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md STATE.md addon.md \
            hardware/experimental/m6-large-v1-best-evidence \
            release/experimental/testatika-m6-large-v1-best-evidence-build-package.zip \
            release/experimental/testatika-m6-large-v1-best-evidence-build-package.zip.sha256 \
            MANIFEST.json MANIFEST_SHA256.txt
          if git diff --cached --quiet; then
            echo 'M6 Large V1 assets/readme/state already materialized and current.'
          else
            git commit -m 'build: materialize M6 Large V1 best-evidence package'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
