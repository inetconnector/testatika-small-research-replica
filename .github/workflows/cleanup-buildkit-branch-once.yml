name: One-time cleanup build-kit branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/BRANCH_CLEANUP_TRIGGER_M2_M6'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete merged build-kit branch only if fully contained in main
        shell: bash
        run: |
          set -euo pipefail
          branch='agent/build-kits-m2-m6'
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            echo "Already absent: $branch"
            exit 0
          fi
          if ! git merge-base --is-ancestor "origin/$branch" HEAD; then
            echo "::error::Refusing to delete unmerged branch: $branch"
            exit 1
          fi
          git push origin --delete "$branch"
