name: Materialize v0.3.0 research package

on:
  push:
    branches: [main]
    paths:
      - 'CITATION.cff'
      - 'CHANGELOG.md'
      - 'scripts/build_release.py'
      - '.github/workflows/materialize-release-v0.3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-writers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Ensure integrity metadata is current before packaging
        run: |
          python scripts/generate_manifest.py
          python scripts/check_manifest.py
      - name: Build v0.3.0 research ZIP
        run: python scripts/build_release.py
      - name: Commit materialized package and refreshed manifests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.json MANIFEST_SHA256.txt \
            release/testatika-small-research-replica-v0.3.0.zip \
            release/testatika-small-research-replica-v0.3.0.zip.sha256
          if git diff --cached --quiet; then
            echo 'v0.3.0 package already materialized.'
          else
            git commit -m 'release: materialize v0.3.0 research package'
            git push origin HEAD:main
          fi
