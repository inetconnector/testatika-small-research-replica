name: One-shot wiring branch retirement 2026-08-19

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-wiring-branch-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate integrated evidence wiring
        run: |
          python scripts/check_evidence_wiring.py
          python scripts/validate_assets.py
      - name: Archive exact source branch tip and delete branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch='agent/wiring-lamella-audit-2026-08-17'
          expected='656c7989d70f195ff3d49c31f0945ba33721e810'
          git fetch origin "$branch"
          actual="$(git rev-parse FETCH_HEAD)"
          [[ "$actual" == "$expected" ]] || { echo "REFUSING: source branch moved: $actual" >&2; exit 1; }
          tag="archive-branch-agent-wiring-lamella-audit-2026-08-17-20260819-${actual:0:12}"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag "$tag" "$actual"
            git push origin "refs/tags/$tag"
          fi
          git push origin --delete "$branch"
      - name: Remove this one-shot workflow and refresh integrity metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-wiring-branch-once.yml
          python scripts/generate_manifest.py
          python scripts/check_manifest.py
          git add MANIFEST.json MANIFEST_SHA256.txt
          git commit -m 'ops: finish wiring branch retirement'
          git push origin main
