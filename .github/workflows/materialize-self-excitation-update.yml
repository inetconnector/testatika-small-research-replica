name: Materialize self-excitation documentation update

on:
  push:
    branches:
      - agent/self-excitation-phase-commutation
    paths:
      - '.github/SELF_EXCITATION_UPDATE_TRIGGER'

permissions:
  contents: write

concurrency:
  group: self-excitation-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install python-docx pillow

      - name: Rebuild valid DE and EN research DOCX
        shell: bash
        run: |
          python - <<'PY'
          from docx import Document
          from docx.shared import Pt, Cm
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          from pathlib import Path

          ROOT=Path('.')

          def setup(doc, title, subtitle):
              for s in doc.sections:
                  s.top_margin=Cm(2); s.bottom_margin=Cm(2); s.left_margin=Cm(2.2); s.right_margin=Cm(2.2)
              doc.styles['Normal'].font.name='Aptos'; doc.styles['Normal'].font.size=Pt(10.5)
              p=doc.add_paragraph(style='Title'); p.alignment=WD_ALIGN_PARAGRAPH.CENTER; p.add_run(title)
              p=doc.add_paragraph(style='Subtitle'); p.alignment=WD_ALIGN_PARAGRAPH.CENTER; p.add_run(subtitle)
              return doc

          def h(doc,t,l=1): doc.add_heading(t,level=l)
          def para(doc,t,bold_prefix=None):
              p=doc.add_paragraph()
              if bold_prefix and t.startswith(bold_prefix):
                  p.add_run(bold_prefix).bold=True; p.add_run(t[len(bold_prefix):])
              else: p.add_run(t)
          def bullet(doc,t): doc.add_paragraph(t,style='List Bullet')
          def formula(doc,t):
              p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER
              r=p.add_run(t); r.font.name='Cambria Math'; r.font.size=Pt(11)

          de=setup(Document(),'Testatika: Funktionsprinzip „Erde – Wolke – Gewitter“','Quellengeleitete technische Arbeitshypothese – aktualisiert um Selbstanregung und Phasenkommutation')
          h(de,'1. Kurzfazit'); para(de,'Das derzeit kohärenteste Modell ist eine phasengesteuerte elektrostatische Ladungszustandsmaschine: variable Kapazität und Influenz erzeugen winkelabhängige Ladungszustände; Gitter formen das Feld; berührungslose Taster nehmen Ladungsänderungen ab; Crystal/Diode sortiert und kommutiert Ladung; Kondensatoren speichern und glätten. Eine Nettoenergiequelle ist damit nicht erklärt.')
          h(de,'2. „Erde“ und „Wolke“'); para(de,'Die historische Methernitha-Sprache lässt sich konservativ als zwei entgegengesetzte Potential-/Feldreservoirs lesen. „Gewitter“ bezeichnet dabei eher wiederholte Ladungstrennung und kontrollierte Ladungsübertragung als das Einfangen realer Blitze.')
          h(de,'3. Variable Kapazität und Influenz'); formula(de,'Q = C(θ) · V'); formula(de,'I = dQ/dt = C·dV/dt + V·dC/dt'); para(de,'Rotierende leitfähige Segmente verändern die Kapazitätsmatrix zu festen Elektroden. Auch ohne Schleifkontakt entstehen dadurch Verschiebungsströme und induzierte Ladungsänderungen.')
          h(de,'4. Gitter und Taster'); bullet(de,'Perforierte Gitter: feldformende/floating Elektroden, Oberflächenladung, Randfelder, mögliche Corona-/Ioneneffekte.'); bullet(de,'Taster/antenna keys: am plausibelsten berührungslose kapazitive Influenzabnehmer, nicht zwingend Funkantennen.'); para(de,'Der historische Hinweis „Gitter statt geschlossene Folie“ ist ein hochprioritärer A/B-Test.')
          h(de,'5. Der Crystal / die Diode'); para(de,'Marinov berichtet den Begriff „crystal“; die Methernitha-Beschreibung nennt einen Gleichrichter mit ungewöhnlicher Zyklusfunktion. Als Arbeitshypothese ist daher ein nichtlinearer Ladungspfad sinnvoll, der Polarität, Schwellwert und Rotorphase auswählt.')
          formula(de,'I = f(V), z. B. Leitung erst für V > V_th')
          h(de,'6. Elektrostatisches Drehmoment'); formula(de,'τ_el ≈ 1/2 · V² · dC/dθ'); para(de,'Entscheidend ist nicht nur die Spannung, sondern an welchem Rotorwinkel der jeweilige Ladungszustand besteht. Phasenverschobenes Laden/Entladen kann positive oder bremsende Drehmomentanteile erzeugen.')
          h(de,'7. Langsam und gleichmäßig'); formula(de,'τ_RC = R_eq · C_eq'); para(de,'Die optimale Drehzahl kann durch RC-Zeit, Oberflächenleckage, dielektrische Relaxation, Corona-/Ionentransport und Schwellwerte bestimmt werden. Das macht die Drehzahl selbst zu einem Teil des elektrischen Zustandsautomaten.')
          h(de,'8. Kleine M2 und große M6'); bullet(de,'M2: etwa 200 mm, floating Rotordrähte/-sektoren, keine schleifenden Kollektoren, zwei seitliche Zwei-Anschluss-Kondensatortöpfe, kein konventioneller Motor in Marinovs Beschreibung.'); bullet(de,'M6-Familie: etwa 500 mm, Gegenrotation, perforierte stationäre Elektroden, komplexe Mehrgitter-/Spulen-/Magnetzylinder; Hauser-M6a mit kleinem DC-Motor/Magnetrad.'); para(de,'M2- und M6-Bauteile dürfen nicht ohne Quelle ineinander zurückprojiziert werden.')
          h(de,'9. Seitliche M2-Töpfe'); para(de,'Marinovs Beschreibung spricht für Kondensatoren: äußeres leitfähiges Gitter, Kunststoff/PMMA als Dielektrikum, innere Kupferspirale als zweite Elektrode und genau zwei sichtbare Anschlüsse. Das ist keine Tesla-Spule in der M2-Basisinterpretation.')
          h(de,'10. Warum trockene Luft hilft'); formula(de,'V(t) = V₀ · exp(−t/(R_leak·C))'); para(de,'Trockene Luft erhöht typischerweise den Oberflächen-Leckwiderstand von PMMA/Isolatoren. Floating Sektoren behalten ihre Ladung länger; bei feuchter Luft zerfällt das Potential schneller. Da Drehmomentanteile ungefähr mit V² skalieren können, wirkt sich Leckage stark aus. Feuchte verändert zusätzlich Corona und Ionentransport.')
          h(de,'11. Mechanisch langsam, elektrisch schneller'); para(de,'Bei etwa 50 Lamellen und 60 U/min sieht eine feste Elektrode ungefähr 50 Segmentpassagen pro Sekunde. Bei zwei gegenläufigen 50er-Mustern kann die relative Ereignisrate in der Größenordnung von 100 Hz liegen. Das ist eine Modellableitung, keine historische Frequenzmessung.')
          h(de,'12. Speicher und Impedanzumformung'); para(de,'Die Primärstufe wäre hochspannend und hochohmig. Kondensator-/Diodenstufen können Ladungsimpulse sammeln und umverteilen. Eine echte Transformatorwirkung großer Spulen setzt zeitveränderliche Ströme/Pulse voraus; idealer konstanter DC lässt sich nicht transformieren.')
          h(de,'13. „Künstliches Gewitter“ als Zyklus');
          for x in ['Priming/Bias','Ladungstrennung („Wolke/Erde“)','C(θ)-Änderung','Feldformung durch Gitter','berührungslose Aufnahme','Crystal-/Dioden-Kommutation','Speicherung','elektrostatisches Drehmoment','Drehzahlstabilisierung','Ausgabe/Last']: bullet(de,x)
          h(de,'14. Was belegt und was offen ist'); para(de,'Relativ gut gestützt sind elektrostatische Influenz, berührungslose Aufnahme, floating M2-Rotorleiter, M2-Kondensatortöpfe, funktionale Gitter und Feuchteabhängigkeit. Offen bleiben Originalverdrahtung, Crystal-Material/I-V, genaue Polaritäten, Priming, Magnet-/Spulenrollen und vor allem die Quelle der behaupteten hohen Ausgangsleistung.')
          h(de,'15. Energiegrenze'); para(de,'Hohe Spannung, ein Lichtbogen oder eine kurz leuchtende Last sind keine geschlossene Energiebilanz. Jede Prüfung muss mechanischen Antrieb, Bias/Hilfsenergie, Anfangs-/Endspeicher, kinetische Energie und reale Lastleistung gleichzeitig erfassen.')
          formula(de,'E_out ≤ E_mech,in + E_bias,in + E_aux,in + ΔE_storage  (Nullhypothese)')
          h(de,'16. Leistungsdichte atmosphärischer Elektrizität'); para(de,'Normale Schönwetter-Atmosphärenelektrizität besitzt eine extrem geringe Leitungsstromdichte (pA/m²). Eine kompakte Innenraummaschine kann damit nach etablierter Atmosphärenphysik keine Dauerleistung von hunderten Watt erklären. Plauson/Jefimenko sind als elektrostatische Vergleichssysteme interessant, aber keine Skalierungsbestätigung für die Testatika.')
          h(de,'17. Last ohne sichtbaren Drehzahlabfall'); para(de,'Wenn Berichte über hunderte Watt oder eine nominelle 1-kW-Lampe real waren und die Scheiben kaum sichtbar abbremsten, ist das ein Hinweis gegen die Scheiben als direkten mechanischen Hauptenergielieferanten. Kurzzeitige Kondensatorenergie, ein Regler/Hilfsantrieb, eine geringere tatsächliche Last oder ein getrennt getakteter Leistungspfad müssen geprüft werden.')
          formula(de,'τ = P/ω; bei 15 U/min: 300 W ≈ 191 N·m, 1 kW ≈ 637 N·m')
          h(de,'18. Höchstprioritäre Experimente');
          for x in ['phasenaufgelöste Knotenkarte + Drehmoment','Mesh-vs.-Folie','Crystal open/short/R/C/Diodenschwellen','Feuchte-/PMMA-Matrix','Load-Reaction mit vollständiger Energiebilanz','Shield-Plate floating/ground/R/C','M6-Motor-/Hilfseingang separat messen']: bullet(de,x)
          h(de,'19. Präzise bisherige Funktionsformulierung'); para(de,'Phasengesteuerte elektrostatische Ladungszustandsverwaltung einer variablen-C-Maschine mit floating Rotorleitern, berührungslosen Pickups, Gitter-Feldsteuerung, nichtlinearer Crystal-/Dioden-Kommutation, getrennten Drive-/Storage-Knoten und zyklischer Bias-Regeneration.')
          h(de,'20. Quellenbasis'); para(de,'Grundlage sind die im Repository auditierten Marinov-/Hauser-Scans, Methernitha-Texte, Holzherr/Cathomen-Berichte, M2-/M6-Quellenkarten, Kontrollreplikations-Audits und konventionelle Elektrostatikvergleichssysteme. Nicht quellenbelegte Verschaltungen werden als Hypothese gekennzeichnet.')
          h(de,'21. Neue Kernhypothese: Selbstanregung statt klassischer Resonanz'); para(de,'Die erhaltene Methernitha-Beschreibung schreibt der Gleichrichterdiode eine ungewöhnliche Regelwirkung zu: Sie halte den Anziehungs-/Abstoßungszyklus in einem stationären Zustand; ohne diese Wirkung sollen sich die Impulse weiter aufsummieren und die Scheiben beschleunigen. Das legt ein selbsterregtes elektromechanisches Rückkopplungssystem nahe. Es ist eine Arbeitshypothese, keine bewiesene Originalschaltung.')
          h(de,'21.1 Geschlossene elektromechanische Rückkopplung',2); formula(de,'ω → C(θ) → Q,V → τ_el → ω'); formula(de,'Q = C(θ)·V'); formula(de,'τ_el ≈ 1/2·V²·dC/dθ')
          h(de,'21.2 Warum sich der Rotor „aufschaukeln“ kann',2); formula(de,'ΔE_Rotor = ∮ τ_el(θ)dθ'); formula(de,'E_rot,n+1 = E_rot,n + ΔE_el − E_Verlust'); para(de,'Ist die Nettoarbeit pro Umdrehung positiv, steigt die Drehzahl. Das ist positive Rückkopplung/Selbstanregung und benötigt zunächst keine LC-Resonanz.')
          h(de,'21.3 Diode / „Crystal“ als elektrostatischer Kommutator',2); para(de,'Der nichtlineare Pfad kann bestimmen, wann Ladung fließen darf: Laden → Antreiben → Ladungsübertragung → Rückstromsperre/Reset. Mit einer Schwellkennlinie I=f(V) kann er Polarität, Schwellwert und indirekt Rotorphase auswählen.')
          h(de,'21.4 Resonanz? Eher Phasensynchronisation',2); formula(de,'T_Segment ~ τ_RC = R·C'); para(de,'Plausibler als eine unbelegte LC-Eigenresonanz ist ein phasensynchroner Arbeitspunkt aus Rotorperiode, RC-/Leck-/Relaxationszeiten, Corona/Ionentransport und Crystal-Schwellwert. Präziser Begriff: phasensynchrone elektrostatische Selbstanregung.')
          h(de,'21.5 Pendel-/Hemmungs-Analogie',2); para(de,'Wie ein Pendel bei jedem richtig getimten Schubs +ΔE erhält, kann ein positiver elektrostatischer Impuls pro Zyklus die Rotationsenergie erhöhen. Crystal/Diode wäre dann funktional die elektrische Hemmung bzw. der Kommutator, der den Zyklus begrenzt und synchronisiert.')
          h(de,'21.6 Moderne Analogien',2); para(de,'Variable Kapazität + Dioden + Kondensatoren + phasenabhängige Ladungszustände sind etablierte Elektromechanik, etwa in selbstprimenden dielektrischen Elastomergeneratoren und MEMS-Elektrostatikgeneratoren mit Spannungsvervielfachern. Das stützt die Schaltungslogik, nicht Overunity.')
          h(de,'21.7 Zwei energetisch verschiedene Kreise',2); formula(de,'Steuer/Drive: Rotor → C(θ) → Gitter/Taster → Crystal/Diode → τ → Rotor'); formula(de,'Leistung/Storage: externe Quelle ? → Speicher/Wandler → Last (rotorgetaktet)'); formula(de,'P_Quelle ≥ P_Last + P_Verluste'); para(de,'Die Rotoren könnten einen größeren Energiefluss takten, ohne ihn zu erzeugen. Genau dadurch wäre geringe Last-Rotor-Rückwirkung prinzipiell erklärbar; die Quelle des Leistungspfads bleibt offen.')
          h(de,'21.8 Direkte Falsifikation',2);
          for x in ['Crystal open/short/R/C/verschiedene Diodenschwellen','Drehzahlsweep auf Phasenoptimum','Torque + alle Knoten vs. Rotorwinkel','Drive-/Bias- und Load-/Storage-Kreise getrennt belasten','Motor-/Hilfseingang unter Last messen','alle Speicherenergien vor/nach Versuch bilanzieren']: bullet(de,x)
          de.save(ROOT/'docs/research/Testatika_Funktionsprinzip_Erde_Wolke_Trockenluft.docx')

          en=setup(Document(),'Testatika: Functional Principle “Earth – Cloud – Thunderstorm”','Source-guided technical working hypothesis – updated with self-excitation and phase commutation')
          sections=[
          ('1. Executive summary','The most coherent current model is a phase-controlled electrostatic charge-state machine: variable capacitance and influence create angle-dependent charge states; grids shape the field; non-contact pickups sense/collect charge changes; crystal/diode routes and commutates charge; capacitors store and smooth it. This does not identify a net-energy source.'),
          ('2. “Earth” and “cloud”','The historical terminology is conservatively read as two opposing potential/field reservoirs. The thunderstorm analogy describes repeated charge separation and controlled transfer, not proven capture of literal lightning.'),
          ('3. Variable capacitance and influence','Q = C(θ)·V; I = dQ/dt = C·dV/dt + V·dC/dt. Rotating conductive sectors alter the capacitance matrix to fixed electrodes and can therefore generate displacement/influence currents without rubbing contact.'),
          ('4. Grids and pickups','Perforated grids are plausible field-forming/floating electrodes with edge-field, surface-charge and possible corona/ion roles. “Taster/antenna keys” are best treated as non-contact capacitive influence pickups unless RF behavior is actually measured.'),
          ('5. Crystal / diode','Marinov reports the term “crystal”; the institutional text assigns a rectifier an unusual cycle-control role. A nonlinear charge path selecting polarity, threshold and rotor phase is therefore a useful falsifiable model.'),
          ('6. Electrostatic torque','For a simplified fixed-voltage structure, τ_el ≈ 1/2·V²·dC/dθ. Torque sign and magnitude depend on which charge state exists at each rotor angle.'),
          ('7. Slow and steady speed','RC time, surface leakage, dielectric relaxation, corona/ion transport and nonlinear thresholds can make rotor speed part of the electrical state machine rather than merely a mechanical parameter.'),
          ('8. Small M2 versus large M6','M2 is the ~200-mm floating-sector small-machine line with two-terminal capacitor pots and no conventional built-in motor in Marinov’s description. M6 is a ~500-mm counterrotating family with perforated stators and much more complex grid/coil/magnet cylinders; Hauser M6a includes a small DC-motor/magnet-wheel system.'),
          ('9. Small side pots','The M2 pots are best-evidence capacitors: outer conductive grid, plastic/PMMA dielectric, inner copper spiral electrode, two external leads. They should not be relabelled as Tesla coils.'),
          ('10. Why dry air helps','Dry air increases effective surface leakage resistance on PMMA/insulators, allowing floating sectors to retain charge longer. Humidity also alters corona and ion transport. V(t)=V0·exp[-t/(R_leak·C)].'),
          ('11. Slow mechanics, faster electrical events','A 50-sector disk at 60 rpm gives about 50 sector passages/s at a fixed electrode; two counterrotating patterns can give relative event rates of order 100 Hz. This is a model estimate, not a historical frequency measurement.'),
          ('12. Storage and impedance conversion','The primary electrostatic stage is expected to be high-voltage/high-impedance. Capacitor/diode stages can collect and redistribute pulses. Any true transformer action requires time-varying current rather than ideal steady DC.'),
          ('13. Artificial-thunderstorm cycle','Priming/bias → opposing field states → C(θ) modulation → grid field shaping → non-contact pickup → crystal/diode commutation → storage → electrostatic torque → speed stabilization → output/load.'),
          ('14. Supported vs unresolved','Relatively well supported: electrostatic influence, non-contact pickup, floating M2 conductors, capacitor nature of M2 pots, functional grids, humidity sensitivity. Unresolved: exact wiring, crystal material/I-V, polarities, priming, magnet/coil roles and the source of claimed high output.'),
          ('15. Energy boundary','High voltage, an arc or a briefly powered load is not a closed energy balance. Mechanical drive, bias/auxiliary input, initial/final storage and real load energy must all be measured simultaneously.'),
          ('16. Atmospheric-electricity power density','Ordinary fair-weather atmospheric conduction current is only in the pA/m² range; established atmospheric physics therefore cannot explain sustained hundreds of watts from a compact indoor collector. Plauson/Jefimenko remain useful electrostatic comparisons, not scaling proof.'),
          ('17. Load without visible speed sag','If reports of hundreds of watts or a nominal 1-kW lamp are genuine and rotor speed barely changes, the disks are unlikely to be the direct mechanical source of that power. Stored capacitor energy, regulation/auxiliary drive, lower actual load, or a separately timed power path must be tested.'),
          ('18. Highest-priority experiments','Phase-resolved nodes+torque; mesh-vs-foil; crystal open/short/R/C/diode thresholds; humidity/PMMA matrix; load reaction with full energy balance; shield-plate variants; separately measured M6 motor/auxiliary input.'),
          ('19. Precise current formulation','Phase-controlled electrostatic charge-state management of a variable-C machine with floating rotor conductors, non-contact pickups, grid field control, nonlinear crystal/diode commutation, separated drive/storage nodes and cyclic bias regeneration.'),
          ('20. Source basis','The repository’s Marinov/Hauser scans, Methernitha text, Holzherr/Cathomen reports, M2/M6 source maps, control-replication audits and conventional electrostatic comparisons are the evidence base. Unknown historical wiring remains explicitly hypothetical.'),
          ]
          for title,text in sections:
              h(en,title); para(en,text)
          h(en,'21. New core hypothesis: self-excitation rather than classical resonance'); para(en,'The surviving Methernitha description assigns the rectifying diode an unusual regulation role: it is said to hold the attraction/repulsion cycle in a steady state; without it the impulses would continue to add and the disks accelerate. This points to a self-excited electromechanical feedback loop, as a working hypothesis rather than a proven historical circuit.')
          h(en,'21.1 Closed electromechanical feedback loop',2); formula(en,'ω → C(θ) → Q,V → τ_el → ω'); formula(en,'Q=C(θ)·V'); formula(en,'τ_el ≈ 1/2·V²·dC/dθ')
          h(en,'21.2 Why the rotor can “run away”',2); formula(en,'ΔE_Rotor = ∮ τ_el(θ)dθ'); formula(en,'E_rot,n+1 = E_rot,n + ΔE_el − E_loss'); para(en,'Positive net work per revolution increases speed: positive feedback/self-excitation, without requiring an LC resonance.')
          h(en,'21.3 Diode / “crystal” as electrostatic commutator',2); para(en,'The nonlinear path can determine when charge may flow: charge → drive → transfer → reverse-current block/reset. A threshold I=f(V) can select polarity, threshold and indirectly rotor phase.')
          h(en,'21.4 Resonance? More likely phase synchronization',2); formula(en,'T_segment ~ τ_RC = R·C'); para(en,'A phase-locked operating point involving rotor period, RC/leak/relaxation times, corona/ion transport and crystal threshold is more directly supported than an unmeasured LC eigenresonance. “Phase-synchronous electrostatic self-excitation” is the more precise term.')
          h(en,'21.5 Pendulum/escapement analogy',2); para(en,'Like a pendulum receiving a correctly timed +ΔE push each pass, positive electrostatic work per cycle can build rotational energy. Crystal/diode would function like an electrical escapement/commutator limiting and synchronizing the cycle.')
          h(en,'21.6 Modern analogues',2); para(en,'Variable capacitance + diodes + capacitors + phase-dependent charge states are established electromechanics in self-priming dielectric-elastomer and MEMS electrostatic harvesters with voltage multipliers/charge-pump cycles. This supports the circuit logic, not over-unity.')
          h(en,'21.7 Two energetically distinct loops',2); formula(en,'Drive/control: rotor → C(θ) → grids/pickups → crystal/diode → τ → rotor'); formula(en,'Power/storage: external source ? → storage/converter → load (rotor-timed)'); formula(en,'P_source ≥ P_load + P_losses'); para(en,'The rotors may gate a larger energy flow without creating it. That can explain weak load-to-rotor coupling in principle; the source of the power path remains unresolved.')
          h(en,'21.8 Direct falsification',2)
          for x in ['crystal open/short/R/C/different diode thresholds','speed sweep for phase optimum','torque + every node versus rotor angle','separate drive/bias and load/storage loading','measure motor/auxiliary input under load','account all stored energy before/after']: bullet(en,x)
          en.save(ROOT/'docs/research/Testatika_Functional_Principle_Earth_Cloud_Dry_Air.docx')
          PY

      - name: Rebuild NET-Journal DOCX
        run: |
          PUB='docs/publications/net-journal'
          python scripts/build_netjournal_assets.py --prepare
          pandoc "$PUB/ARTICLE.md" --from=gfm --resource-path="$PUB" --reference-doc="$PUB/netjournal-reference.docx" --metadata title='Testatika neu gelesen' --output="$PUB/Testatika_Beitragsvorschlag_NET-Journal_2026.docx"
          python scripts/build_netjournal_assets.py --finalize "$PUB/Testatika_Beitragsvorschlag_NET-Journal_2026.docx"
          rm -f "$PUB/netjournal-reference.docx"

      - name: Verify generated DOCX
        run: |
          python - <<'PY'
          from docx import Document
          checks={
            'docs/research/Testatika_Funktionsprinzip_Erde_Wolke_Trockenluft.docx':'21. Neue Kernhypothese: Selbstanregung statt klassischer Resonanz',
            'docs/research/Testatika_Functional_Principle_Earth_Cloud_Dry_Air.docx':'21. New core hypothesis: self-excitation rather than classical resonance',
            'docs/publications/net-journal/Testatika_Beitragsvorschlag_NET-Journal_2026.docx':'Neue Kernhypothese: positive Rückkopplung und phasenabhängige Kommutation',
          }
          for f,m in checks.items():
            d=Document(f); txt='\n'.join(p.text for p in d.paragraphs); assert m in txt; print(f,'OK',len(d.paragraphs))
          PY

      - name: Commit generated files and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/SELF_EXCITATION_UPDATE_TRIGGER .github/workflows/materialize-self-excitation-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/research/Testatika_Funktionsprinzip_Erde_Wolke_Trockenluft.docx docs/research/Testatika_Functional_Principle_Earth_Cloud_Dry_Air.docx docs/publications/net-journal/Testatika_Beitragsvorschlag_NET-Journal_2026.docx docs/publications/net-journal/charge_state_model.png .github/SELF_EXCITATION_UPDATE_TRIGGER .github/workflows/materialize-self-excitation-update.yml
          git commit -m 'docs: materialize self-excitation analysis'
          git push origin HEAD:${GITHUB_REF_NAME}
