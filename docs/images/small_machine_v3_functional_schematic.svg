<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860">
<style>
    .box{fill:#f8f8f8;stroke:#222;stroke-width:2}
    .note{fill:#fffde7;stroke:#b58900;stroke-width:2}
    .node{font: 20px sans-serif; fill:#111}
    .small{font: 16px sans-serif; fill:#222}
    .title{font: bold 28px sans-serif; fill:#111}
    .wire{stroke:#222; stroke-width:3; fill:none}
    .cap{stroke:#0a58ca; stroke-width:3; fill:none}
    .guess{stroke:#b02a37; stroke-width:3; stroke-dasharray:10 8; fill:none}
</style>
<rect x="0" y="0" width="1280" height="860" fill="white"/>
<text x="24" y="40" class="title">Testatika small machine — provisional functional schematic (V3 photo interpretation)</text>
<text x="24" y="68" class="small">Solid lines = externally plausible electrical associations from photo + Marinov. Red dashed lines = speculative/unknown coupling.</text>

<rect x="515" y="170" width="250" height="240" rx="12" class="box"/>
<text x="555" y="205" class="node">Rotor disc with 20–25 sectors</text>
<text x="560" y="235" class="small">through-disc routing crucial</text>
<text x="560" y="260" class="small">non-contact charging/collecting</text>
<text x="560" y="285" class="small">central hub = mechanical axis</text>
<text x="560" y="330" class="small">R node family on moving sectors</text>

<rect x="450" y="80" width="390" height="70" rx="12" class="note"/>
<text x="470" y="112" class="node">Top module (“crystal” according to Baumann / Marinov)</text>
<text x="470" y="138" class="small">Possible rectifying, threshold, leakage-control or balancing function. Exact device unknown.</text>

<rect x="170" y="170" width="220" height="90" rx="10" class="box"/>
<text x="190" y="205" class="node">Left spring tower +</text>
<text x="190" y="230" class="node">slanted pickup bar</text>
<text x="190" y="252" class="small">stationary electrode family EL</text>

<rect x="890" y="170" width="220" height="90" rx="10" class="box"/>
<text x="915" y="205" class="node">Right spring tower +</text>
<text x="915" y="230" class="node">slanted pickup bar</text>
<text x="915" y="252" class="small">stationary electrode family ER</text>

<rect x="90" y="310" width="230" height="90" rx="10" class="box"/>
<text x="120" y="345" class="node">Left outer collector panel</text>
<text x="120" y="372" class="small">fine black grid inside white frame</text>

<rect x="960" y="310" width="230" height="90" rx="10" class="box"/>
<text x="990" y="345" class="node">Right outer collector panel</text>
<text x="990" y="372" class="small">fine black grid inside white frame</text>

<rect x="510" y="450" width="250" height="90" rx="10" class="box"/>
<text x="545" y="485" class="node">Lower front collector panel</text>
<text x="545" y="512" class="small">possibly output / balancing / field shaping</text>

<rect x="110" y="590" width="240" height="110" rx="10" class="box"/>
<text x="130" y="625" class="node">Left pot capacitor module</text>
<text x="130" y="650" class="small">outer cylindrical grid</text>
<text x="130" y="675" class="small">dielectric sleeve</text>
<text x="130" y="700" class="small">inner copper spiral</text>

<rect x="930" y="590" width="240" height="110" rx="10" class="box"/>
<text x="950" y="625" class="node">Right pot capacitor module</text>
<text x="950" y="650" class="small">outer cylindrical grid</text>
<text x="950" y="675" class="small">dielectric sleeve</text>
<text x="950" y="700" class="small">inner copper spiral</text>

<rect x="430" y="620" width="410" height="120" rx="10" class="note"/>
<text x="450" y="653" class="node">Working interpretation of node families</text>
<text x="450" y="680" class="small">A: left electrostatic family / B: right electrostatic family / C: lower front balancing-output family</text>
<text x="450" y="705" class="small">Side pots most plausibly act as charge reservoirs / stabilizers rather than hidden Tesla transformers.</text>
<text x="450" y="730" class="small">Magnets remain geometrically present on the first small machine, but their electrical role is unresolved.</text>

<path d="M 515 250 C 455 250, 420 225, 390 215" class="wire"/>
<path d="M 765 250 C 825 250, 860 225, 890 215" class="wire"/>
<path d="M 315 355 C 400 355, 455 315, 515 300" class="wire"/>
<path d="M 960 355 C 880 355, 825 315, 765 300" class="wire"/>
<path d="M 635 410 L 635 450" class="wire"/>
<path d="M 645 150 L 645 170" class="guess"/>
<path d="M 250 400 C 250 480, 220 520, 220 590" class="cap"/>
<path d="M 1030 400 C 1030 480, 1050 520, 1050 590" class="cap"/>
<path d="M 635 540 C 635 585, 635 590, 635 620" class="guess"/>
<path d="M 350 645 C 390 645, 410 645, 430 645" class="guess"/>
<path d="M 840 645 C 900 645, 910 645, 930 645" class="guess"/>

<text x="234" y="512" class="small">capacitive / reservoir coupling</text>
<text x="904" y="512" class="small">capacitive / reservoir coupling</text>
<text x="666" y="160" class="small">unknown “crystal” coupling</text>
<text x="660" y="580" class="small">provisional lower-node continuation</text>
</svg>
